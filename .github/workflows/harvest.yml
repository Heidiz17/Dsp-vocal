name: 雲端全自動音源大收割

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 安裝環境
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests

      - name: 執行全宇宙大收割
        run: python harvest_full.py

      - name: 打包成 ZIP 下載包
        uses: actions/upload-artifact@v4
        with:
          name: arcatdia-324-vocals
          path: vocal_samples/

      - name: 自動 Commit 回倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vocal_samples/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: 雲端收割 324 粒乾淨日文音源庫" && git push)
