name: 雲端全自動圭太男聲音源大收割

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4

      - name: 安裝環境
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests

      - name: 執行圭太男聲 324 粒大收割
        run: python harvest_keita.py

      - name: 打包成 ZIP 下載包
        uses: actions/upload-artifact@v4
        with:
          name: keita-324-vocals
          path: keita_vocals/

      - name: 自動 Commit 回倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keita_vocals/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: 雲端收割 324 粒圭太 (Keita) 完整起音男聲音源庫" && git push)
          
